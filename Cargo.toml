[package]
name = "vernesoft"
version = "0.4.0"
edition = "2021"
rust-version = "1.75"
description = "Official Rust SDK for the Verne Nautilus platform"
license = "MIT"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
mockito = "1"
